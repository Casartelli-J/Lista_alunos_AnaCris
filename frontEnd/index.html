<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lista alunos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<style>
		body{
			background-color: #6884D9;
		}
	</style>
</head>
<body>

	<div class="modal fade" id="modalAdd" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
    		<div class="modal-content">
        		<div class="modal-header">
	        		<h1 class="modal-title fs-5" id="exampleModalLabel">Adicionar Aluno</h1>
	        		<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      		</div>
	    		<div class="modal-body">
        			<form>
						<div class="mb-3">
							<label class="form-label">Nome</label>
							<input type="email" class="form-control" id="nome">
						</div>
						<div class="mb-3">
					    	<label class="form-label">Cor</label>
					    	<select class="form-select" id="cor">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				Rosa
					    		</option>
					    		<option value="1">
				    				Rosa claro
					    		</option>
					    	</select>
						</div>
						<div class="mb-3">
							<label class="form-label">Tamanho</label>
							<select class="form-select" id="tamanho">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				P
					    		</option>
					    		<option value="1">
				    				M
					    		</option>
					    	</select>
						</div>
						<div class="mb-3">
					    	<label class="form-label">Malha</label>
					    	<select class="form-select" id="malha">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				Algodão
					    		</option>
					    		<option value="1">
				    				Dry Fit
					    		</option>
					    	</select>
						</div>
						<div class="mb-3">
							<label for="exampleInputEmail1" class="form-label">Preço</label>
							<input type="number" class="form-control" id="preco">
						</div>
					  	<button type="button" class="btn btn-primary" onclick="postAluno()">Cadastrar</button>
					</form>
	      		</div>	
	    	</div>
		</div>
	</div>

	<header class="container-fluid">
		<div class="row bg-primary">
			<h1 class="p-3 text-center">
				Lista de Alunos que querem camiseta
			</h1>
		</div>
	</header>
	<main class="container">
		<div class="row">
			<div class="col-12 mt-3">
				<button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#modalAdd">
					Adicionar Aluno
				</button>
			</div>
			<div class="input-group my-3">
  				<input type="text" class="form-control" placeholder="Nome do aluno" aria-label="Nome do aluno">
  				<button class="btn btn-success" type="button" onclick="getAlunos()">Button</button>
			</div>
			<table class="table">
				<thead>
					<tr>
						<th scope="col">Nome</th>
						<th scope="col">Cor</th>
						<th scope="col">Tamanho</th>
						<th scope="col">Malha</th>
						<th scope="col">Preço</th>
						<th scope="col"></th>
					</tr>
		    	</thead>
				<tbody id="corpoLista">
				</tbody>
			</table>
		</div>
	</main>


	<script src="script.js"></script>
</body>
</html>
