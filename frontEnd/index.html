<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lista alunos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<style>
		body{
			background-color: #6884D9;
		}
	</style>
</head>
<body>
	<div class="modal fade" id="updModal" tabindex="-1">
		<div class="modal-dialog">
    		<div class="modal-content">
        		<div class="modal-header">
	        		<h1 class="modal-title fs-5">Atualizar Aluno</h1>
	      		</div>
	    		<div class="modal-body">
        			<form id="updForm">
						<input hidden type="number" id="updId">
						<div class="mb-3">
							<label class="form-label">Nome</label>
							<input type="email" class="form-control" id="updNome">
						</div>
						<div class="mb-3">
					    	<label class="form-label">Cor</label>
					    	<select class="form-select" id="updCor">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				Rosa bebê
					    		</option>
					    		<option value="1">
				    				Rosa pink
					    		</option>
					    		<option value="2">
				    				Azul
					    		</option>
					    	</select>
						</div>
						<div class="mb-3">
							<label class="form-label">Tamanho</label>
							<select class="form-select" id="updTamanho">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				PP
					    		</option>
					    		<option value="1">
				    				P
					    		</option>
					    		<option value="2">
				    				M
					    		</option>
								<option value="3">
									G
								</option>
								<option value="4">
									GG
								</option>
					    	</select>
						</div>
						<div class="mb-3">
					    	<label class="form-label">Malha</label>
					    	<select class="form-select" id="updMalha">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				Algodão
					    		</option>
					    		<option value="1">
				    				Dry Fit
					    		</option>
					    	</select>
						</div>
						<div class="mb-3">
							<label for="exampleInputEmail1" class="form-label">Preço</label>
							<input type="number" class="form-control" id="updPreco">
						</div>
					  	<button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="updAluno()">Atualizar</button>
					</form>
	      		</div>	
	    	</div>
		</div>
	</div>
	<div class="modal fade" id="modalAdd" tabindex="-1">
		<div class="modal-dialog">
    		<div class="modal-content">
        		<div class="modal-header">
	        		<h1 class="modal-title fs-5" id="exampleModalLabel">Adicionar Aluno</h1>
	      		</div>
	    		<div class="modal-body">
        			<form id="addForm">
						<div class="mb-3">
							<label class="form-label">Nome</label>
							<input type="email" class="form-control" id="modalNome">
						</div>
						<div class="mb-3">
					    	<label class="form-label">Cor</label>
					    	<select class="form-select" id="cor">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				Rosa bebê
					    		</option>
					    		<option value="1">
				    				Rosa pink
					    		</option>
					    		<option value="2">
				    				Azul
					    		</option>
					    	</select>
						</div>
						<div class="mb-3">
							<label class="form-label">Tamanho</label>
							<select class="form-select" id="tamanho">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				PP
					    		</option>
					    		<option value="1">
				    				P
					    		</option>
					    		<option value="2">
				    				M
					    		</option>
								<option value="3">
									G
								</option>
								<option value="4">
									GG
								</option>
					    	</select>
						</div>
						<div class="mb-3">
					    	<label class="form-label">Malha</label>
					    	<select class="form-select" id="malha">
					    		<option>
				    				---
					    		</option>
					    		<option value="0">
				    				Algodão
					    		</option>
					    		<option value="1">
				    				Dry Fit
					    		</option>
					    	</select>
						</div>
						<div class="mb-3">
							<label for="exampleInputEmail1" class="form-label">Preço</label>
							<input type="number" class="form-control" id="preco">
						</div>
					  	<button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="postAluno()">Cadastrar</button>
					</form>
	      		</div>	
	    	</div>
		</div>
	</div>

	<header class="container-fluid">
		<div class="row bg-primary">
			<h1 class="p-3 text-center">
				Lista de Alunos que querem camiseta
			</h1>
		</div>
	</header>
	<main class="container">
		<div class="row d-flex">
			<div class="col-12 mt-3">
				<div class="col-12">
					<div class="input-group my-3">
		  				<input type="text" class="form-control" id="nome" placeholder="Nome do aluno" onkeydown="getAlunos()" aria-label="Nome do aluno">
					</div>
				</div>
				<div class="row d-flex">
					<div class="col-10">
						<table class="table-dark rounded bg-black col-12">
							<thead>
								<tr class="text-center">
									<th>Nome</th>
									<th>Cor</th>
									<th>Tamanho</th>
									<th>Malha</th>
									<th>Preço</th>
									<th></th>
								</tr>
					    	</thead>
							<tbody id="corpoLista">
							</tbody>
						</table>
					</div>
					<div class="col-2 text-center">
						<button class="btn btn-dark px-5 py-2 m-0 mb-3" data-bs-toggle="modal" data-bs-target="#modalAdd">
							Adicionar Aluno
						</button>
					</div>
				</div>
			</div>
		</div>
	</main>


	<script src="script.js"></script>
</body>
</html>
