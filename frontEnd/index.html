<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lista alunos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

	<style>
		:root {
			--bg-start: #5f7bd8;
			--bg-end: #8196df;
			--surface: rgba(255, 255, 255, 0.96);
			--surface-soft: #f7f8fc;
			--text-main: #1f2937;
			--text-muted: #6b7280;
			--border-soft: #e6e9f2;
			--primary: #3658c7;
			--primary-dark: #2947ad;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--text-main);
			background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
		}

		.app-header {
			padding: 3rem 1rem 5.5rem;
			text-align: center;
			color: #fff;
		}

		.app-header h1 {
			margin: 0;
			font-size: clamp(1.75rem, 4vw, 2.75rem);
			font-weight: 800;
			letter-spacing: -0.03em;
		}

		.app-header p {
			max-width: 620px;
			margin: .75rem auto 0;
			font-size: clamp(.95rem, 2vw, 1.05rem);
			color: rgba(255, 255, 255, .82);
		}

		.main-wrapper {
			margin-top: -3.25rem;
			padding-bottom: 3rem;
		}

		.content-card {
			background: var(--surface);
			border: 1px solid rgba(255, 255, 255, .4);
			border-radius: 1.5rem;
			box-shadow: 0 22px 55px rgba(28, 45, 105, .22);
			overflow: hidden;
		}

		.toolbar {
			display: flex;
			gap: .75rem;
			align-items: center;
			justify-content: space-between;
			padding: 1.25rem;
			border-bottom: 1px solid var(--border-soft);
			background: rgba(255, 255, 255, .7);
		}

		.search-box {
			position: relative;
			flex: 1 1 420px;
			max-width: 620px;
		}

		.search-box::before {
			content: "⌕";
			position: absolute;
			left: 1rem;
			top: 50%;
			transform: translateY(-52%);
			font-size: 1.45rem;
			line-height: 1;
			color: #7b849e;
			pointer-events: none;
			z-index: 2;
		}

		.search-box .form-control {
			min-height: 48px;
			padding-left: 2.9rem;
			border: 1px solid var(--border-soft);
			border-radius: .85rem;
			background: var(--surface-soft);
			box-shadow: none;
		}

		.search-box .form-control:focus,
		.modal .form-control:focus,
		.modal .form-select:focus {
			border-color: rgba(54, 88, 199, .55);
			box-shadow: 0 0 0 .22rem rgba(54, 88, 199, .12);
		}

		.btn-add {
			min-height: 48px;
			padding: .7rem 1.1rem;
			border: 0;
			border-radius: .85rem;
			font-weight: 700;
			white-space: nowrap;
			background: var(--primary);
			box-shadow: 0 8px 18px rgba(54, 88, 199, .24);
		}

		.btn-add:hover,
		.btn-add:focus {
			background: var(--primary-dark);
		}

		.table-container {
			padding: 1.25rem;
		}

		.table-responsive {
			border: 1px solid var(--border-soft);
			border-radius: 1rem;
			overflow-x: auto;
		}

		.student-table {
			min-width: 720px;
			margin: 0;
			vertical-align: middle;
		}

		.student-table thead th {
			padding: 1rem;
			border: 0;
			font-size: .78rem;
			font-weight: 800;
			text-transform: uppercase;
			letter-spacing: .06em;
			color: #5d657c;
			background: #f1f3f9;
		}

		.student-table tbody td {
			padding: 1rem;
			border-color: #edf0f5;
			color: var(--text-main);
			background: #fff;
		}

		.student-table tbody tr:last-child td {
			border-bottom: 0;
		}

		.student-table tbody tr:hover td {
			background: #fafbff;
		}

		.modal-content {
			border: 0;
			border-radius: 1.25rem;
			box-shadow: 0 24px 70px rgba(15, 23, 42, .24);
			overflow: hidden;
		}

		.modal-header {
			padding: 1.25rem 1.5rem;
			border-bottom: 1px solid var(--border-soft);
		}

		.modal-title {
			font-weight: 800;
		}

		.modal-body {
			padding: 1.5rem;
		}

		.modal .form-label {
			font-size: .9rem;
			font-weight: 700;
			color: #4b5563;
		}

		.modal .form-control,
		.modal .form-select {
			min-height: 46px;
			border-radius: .75rem;
			border-color: var(--border-soft);
			background-color: #fbfcff;
		}

		.modal .btn-primary {
			min-height: 46px;
			border: 0;
			border-radius: .75rem;
			font-weight: 700;
			background: var(--primary);
		}

		@media (max-width: 767.98px) {
			.app-header {
				padding-top: 2.25rem;
				padding-bottom: 4.75rem;
			}

			.main-wrapper {
				margin-top: -2.8rem;
			}

			.content-card {
				border-radius: 1.1rem;
			}

			.toolbar {
				flex-direction: column;
				align-items: stretch;
				padding: 1rem;
			}

			.search-box {
				max-width: none;
				flex-basis: auto;
			}

			.btn-add {
				width: 100%;
			}

			.table-container {
				padding: 1rem;
			}
		}

		@media (max-width: 575.98px) {
			.main-wrapper {
				padding-left: .75rem;
				padding-right: .75rem;
			}

			.modal-dialog {
				margin: .75rem;
			}
		}
	</style>
</head>
<body>
	<div class="modal fade" id="updModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5">Atualizar Aluno</h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
				</div>
				<div class="modal-body">
					<form id="updForm">
						<input hidden type="number" id="updId">

						<div class="mb-3">
							<label class="form-label">Nome</label>
							<input type="email" class="form-control" id="updNome" placeholder="Digite o nome do aluno">
						</div>

						<div class="mb-3">
							<label class="form-label">Cor</label>
							<select class="form-select" id="updCor">
								<option>---</option>
								<option value="0">Rosa bebê</option>
								<option value="1">Rosa pink</option>
								<option value="2">Azul</option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label">Tamanho</label>
							<select class="form-select" id="updTamanho">
								<option>---</option>
								<option value="0">PP</option>
								<option value="1">P</option>
								<option value="2">M</option>
								<option value="3">G</option>
								<option value="4">GG</option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label">Malha</label>
							<select class="form-select" id="updMalha">
								<option>---</option>
								<option value="0">Algodão</option>
								<option value="1">Dry Fit</option>
							</select>
						</div>

						<div class="mb-4">
							<label for="updPreco" class="form-label">Preço</label>
							<input type="number" class="form-control" id="updPreco" placeholder="0,00">
						</div>

						<div class="d-grid">
							<button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="updAluno()">Atualizar</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="modalAdd" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5" id="exampleModalLabel">Adicionar Aluno</h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
				</div>
				<div class="modal-body">
					<form id="addForm">
						<div class="mb-3">
							<label class="form-label">Nome</label>
							<input type="email" class="form-control" id="modalNome" placeholder="Digite o nome do aluno">
						</div>

						<div class="mb-3">
							<label class="form-label">Cor</label>
							<select class="form-select" id="cor">
								<option>---</option>
								<option value="0">Rosa bebê</option>
								<option value="1">Rosa pink</option>
								<option value="2">Azul</option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label">Tamanho</label>
							<select class="form-select" id="tamanho">
								<option>---</option>
								<option value="0">PP</option>
								<option value="1">P</option>
								<option value="2">M</option>
								<option value="3">G</option>
								<option value="4">GG</option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label">Malha</label>
							<select class="form-select" id="malha">
								<option>---</option>
								<option value="0">Algodão</option>
								<option value="1">Dry Fit</option>
							</select>
						</div>

						<div class="mb-4">
							<label for="preco" class="form-label">Preço</label>
							<input type="number" class="form-control" id="preco" placeholder="0,00">
						</div>

						<div class="d-grid">
							<button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="postAluno()">Cadastrar</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<header class="app-header">
		<div class="container">
			<h1>Lista de Alunos que querem camiseta</h1>
			<p>Consulte os alunos cadastrados, encontre um nome rapidamente e gerencie os pedidos em um só lugar.</p>
		</div>
	</header>

	<main class="container main-wrapper">
		<section class="content-card" aria-label="Lista de alunos">
			<div class="toolbar">
				<div class="search-box">
					<input type="text" class="form-control" id="nome" placeholder="Buscar pelo nome do aluno" onkeydown="getAlunos()" aria-label="Nome do aluno">
				</div>

				<button class="btn btn-primary btn-add" data-bs-toggle="modal" data-bs-target="#modalAdd">
					+ Adicionar Aluno
				</button>
			</div>

			<div class="table-container">
				<div class="table-responsive">
					<table class="table student-table">
						<thead>
							<tr>
								<th class="text-center">Nome</th>
								<th class="text-center">Cor</th>
								<th class="text-center">Tamanho</th>
								<th class="text-center">Malha</th>
								<th class="text-center">Preço</th>
								<th class="text-center">Ações</th>
							</tr>
						</thead>
						<tbody id="corpoLista"></tbody>
					</table>
				</div>
			</div>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
